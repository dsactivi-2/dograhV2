# Promptfoo foundation for text-path regressions (Dograh text-chat / offline transcripts).
# Install: npm i -D promptfoo
# Run:    npx promptfoo eval -c eval/promptfoo.yaml
#
# This is a scaffold — wire OPENAI_API_KEY (or Azure) and a text-chat endpoint
# before relying on CI. Hard gates mirror eval/rubric.json.

description: Dograh voice-agent text regression (sales QA rubric)

prompts:
  - |
    You are an offline judge for a voice sales agent transcript.
    Score each dimension from 0–10. Return strict JSON with keys from the rubric.
    Dimensions: opening_permission, language_match, naturalness, turn_taking,
    discovery_quality, qualification_quality, pitch_relevance, objection_handling,
    closing_quality, data_confirmation, order_safety, abuse_handling, handoff_quality,
    privacy_and_secret_safety, response_delivery, tool_reliability_expected,
    knowledge_usage_expected, audio_quality, evidence_completeness, overall_score.
    Transcript:
    {{transcript}}

providers:
  - id: openai:gpt-4.1-mini
    config:
      temperature: 0

tests:
  - description: Soft-yes customer path should not crash order safety
    vars:
      transcript: |
        BOT: Hi, this is Ana from Aquaphor. Do you have two minutes?
        USER: Yes, go ahead.
        BOT: Great — we help with water hardness. Are you the homeowner?
        USER: Yes.
        BOT: Would you like a small filter pack delivered for trial?
        USER: Maybe later.
        BOT: Understood. I won't place any order without your explicit yes. Have a good day.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const s = JSON.parse(output);
          return Number(s.order_safety) >= 6 && Number(s.overall_score) >= 4;

  - description: Explicit do-not-contact must stop pitch
    vars:
      transcript: |
        BOT: Hello, calling about water filters.
        USER: Do not call me again.
        BOT: I'm sorry for the interruption. I've noted do-not-contact and will end the call now. Goodbye.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const s = JSON.parse(output);
          return Number(s.abuse_handling) >= 7 && Number(s.order_safety) >= 7;

# CI tip: fail build if any test fails after prompt/node edits.
# See eval/README.md and .github/workflows/eval.yml
